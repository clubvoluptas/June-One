<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>June One LLC</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; } 

  :root {
    --black: #0a0a0a;
    --white: #f5f0ea;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --muted: #5a5248;
    --muted-dim: #2e2922;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    letter-spacing: 0.08em;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5rem 2rem;
    position: relative;
  }

  .page::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(ellipse at center, rgba(201,169,110,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .top-rule {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--gold));
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeDown 1.4s ease forwards 0.2s;
  }

  .llc-mark {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.55rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.8rem;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards 0.5s;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3.2rem, 9vw, 7rem);
    letter-spacing: 0.22em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--white);
    text-align: center;
    opacity: 0;
    animation: fadeIn 1.4s ease forwards 0.7s;
  }

  .wordmark em {
    font-style: italic;
    color: var(--gold-light);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    margin: 2.4rem 0;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1s;
  }

  .divider-line {
    width: 70px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider-line.right {
    background: linear-gradient(to left, transparent, var(--gold));
  }
  .divider-diamond {
    width: 4px;
    height: 4px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    letter-spacing: 0.16em;
    color: var(--gold-light);
    text-align: center;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.1s;
    max-width: 560px;
    line-height: 1.6;
  }

  .pillars {
    display: flex;
    gap: 3rem;
    margin: 2.8rem 0;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.5s;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pillar {
    font-size: 0.48rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.4s ease;
    cursor: default;
    position: relative;
    padding-bottom: 4px;
  }

  .pillar::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  .pillar:hover { color: var(--gold-light); }
  .pillar:hover::after { width: 100%; }

  /* Brands — Roomsacred left, Club Voluptas right */
  .brands {
    display: flex;
    align-items: center;
    gap: clamp(2.5rem, 7vw, 6rem);
    margin-top: 1rem;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.8s;
    flex-wrap: wrap;
    justify-content: center;
  }

  .brand-link {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.85rem;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .brand-link:hover { transform: translateY(-5px); }

  .brand-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.5rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.4s ease;
    text-align: center;
  }

  .brand-link:hover .brand-name { color: var(--gold-light); }

  .brand-logo {
    display: block;
    opacity: 0.82;
    transition: opacity 0.4s ease, filter 0.4s ease;
  }

  .brand-link:hover .brand-logo {
    opacity: 1;
    filter: drop-shadow(0 0 20px rgba(201,169,110,0.35));
  }

  .logo-oo {
    width: clamp(110px, 16vw, 145px);
    height: auto;
    object-fit: contain;
  }

  .logo-v {
    width: clamp(70px, 11vw, 95px);
    height: clamp(70px, 11vw, 95px);
    object-fit: contain;
  }

  .brand-sep {
    width: 1px;
    height: 55px;
    background: linear-gradient(to bottom, transparent, var(--muted-dim), transparent);
    align-self: center;
  }

  /* Footer */
  .footer {
    margin-top: 4.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    opacity: 0;
    animation: fadeIn 1s ease forwards 2.2s;
  }

  .bottom-rule {
    width: 1px;
    height: 40px;
    background: linear-gradient(to top, transparent, var(--muted-dim));
  }

  .footer-bottom {
    display: flex;
    align-items: center;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .footer-text {
    font-size: 0.4rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted-dim);
  }

  .footer-dot {
    width: 2px;
    height: 2px;
    background: var(--muted-dim);
    border-radius: 50%;
  }

  /* Inquire link — no email visible in source, set via JS */
  .footer-inquire {
    font-size: 0.4rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.3s ease;
    cursor: pointer;
  }

  .footer-inquire:hover { color: var(--gold); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform-origin: top; transform: scaleY(0); }
    to { opacity: 1; transform: scaleY(1); }
  }

  @media (max-width: 480px) {
    .brand-sep { display: none; }
    .brands { gap: 2rem; }
    .pillars { gap: 1.8rem; }
    .footer-dot { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="top-rule"></div>
  <p class="llc-mark">June One LLC</p>
  <h1 class="wordmark">Designing <em>Desire</em></h1>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line right"></div>
  </div>

  <p class="tagline">A private company developing brands at the intersection of intimacy, design, and experience</p>


</body>
</html>
